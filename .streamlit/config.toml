[theme]
base = "light"
primaryColor = "#1B3026"
backgroundColor = "#F7F5EE"
secondaryBackgroundColor = "#EFECE4"
textColor = "#191C1A"
font = "serif"

[client]
toolbarMode = "minimal"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
